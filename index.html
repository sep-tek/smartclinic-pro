<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smartclinic-pro</title>
      <script>
      (function () {
        try {
          var theme = localStorage.getItem("smartclinic-theme") || "default";
          var resolved = theme;
          if (theme === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          } else if (
            theme === "light" ||
            theme === "dark" ||
            theme === "midnight" ||
            theme === "warm" ||
            theme === "ocean" ||
            theme === "lavender" ||
            theme === "graphite"
          ) {
            resolved = theme;
          } else {
            resolved = "dark";
          }
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
